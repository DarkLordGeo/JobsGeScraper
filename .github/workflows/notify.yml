name: Scrape and notify subscribers

# Scrapes every category with at least one subscriber and messages
# subscribers about newly-posted jobs. Runs less often than the bot
# polling workflow since scraping (with jobs.ge's crawl-delay respected)
# can take a while for large categories — tune the cron below to taste.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scrape subscribed categories and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python notifier.py

      - name: Commit snapshot changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Update job snapshots"
            git pull --rebase --autostash
            git push
          fi
