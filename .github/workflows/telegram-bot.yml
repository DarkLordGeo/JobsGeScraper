name: Telegram bot polling

# Picks up any /subscribe, /unsubscribe etc. commands sent to the bot
# since the last run and updates data/subscribers.json accordingly.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Poll Telegram for new commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Commit subscriber changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update subscriber preferences"
            git pull --rebase --autostash
            git push
          fi
