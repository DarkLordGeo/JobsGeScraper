name: Telegram bot polling

# Picks up any /subscribe, /unsubscribe etc. commands sent to the bot
# since the last run and updates data/subscribers.json accordingly.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # secrets can't be referenced directly in `if:` conditions, only in
    # env/with/container/services — so route it through env first and
    # check env.TELEGRAM_BOT_TOKEN below instead.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Forks don't inherit secrets from this repo — each fork owner must
      # add their own TELEGRAM_BOT_TOKEN under Settings > Secrets and
      # variables > Actions for these workflows to do anything. Skip
      # cleanly instead of failing the run until they've set it up.
      - name: Warn if bot token is missing
        if: ${{ env.TELEGRAM_BOT_TOKEN == '' }}
        run: echo "::warning::TELEGRAM_BOT_TOKEN secret is not set — skipping. See README 'Using your own fork'."

      - name: Poll Telegram for new commands
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: python bot.py

      - name: Commit subscriber changes
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update subscriber preferences"
            git pull --rebase --autostash
            git push
          fi
